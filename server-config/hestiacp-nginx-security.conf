# PURSUIT PATHWAYS LMS — HestiaCP nginx Security Config
# ------------------------------------------------------------------
# Source-code protection: blocks web access to sensitive files so the
# code can only be viewed/edited through the Hestia File Manager.
#
# INSTALLATION (HestiaCP)
# -----------------------
# Copy this file to:
#   /home/Nathan/conf/web/h-pcas.pursuitpathways.com/nginx.ssl.conf_security
# Also symlink for non-SSL:
#   /home/Nathan/conf/web/h-pcas.pursuitpathways.com/nginx.conf_security
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# For edu.pursuitpathways.com, use that domain's paths instead.
# ------------------------------------------------------------------

# ── Block ALL dot-files except .well-known (needed for SSL/ACME) ──
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# ── Block sensitive file extensions ──
# .env  .log  .lock  .bak  .swp  .md  .map (source maps)  .ini  .conf
location ~* \.(env|log|lock|bak|swp|md|map|ini|conf)$ {
    deny all;
    return 404;
}

# ── Block specific sensitive filenames anywhere in the tree ──
location ~* (^|/)(\.env|\.user\.ini|\.editorconfig|composer\.json|package\.json|package-lock\.json|\.htaccess|\.htpasswd)$ {
    deny all;
    return 404;
}

# ── Block direct access to backend bootstrap/include PHP files ──
location ~* (bootstrap|s3-helpers|moodle-bridge|_diag)\.php$ {
    deny all;
    return 404;
}

# ── Block direct access to PHP files in includes/ (allow static CSS/JS/images) ──
location ~ ^/includes/.*\.php$ {
    deny all;
    return 404;
}

# ── Disable source maps (prevents leaking original client code paths) ──
location ~* \.js\.map$ {
    deny all;
    return 404;
}
# ── Clean URLs (sleek, no .php in the address bar) ──
# Analytics pages are directory-based now (analytics/organization/index.php
# etc.), so no clean-URL rewrite is needed for them.
location = /logout                 { rewrite ^ /logout.php last; }
# ── Custom error pages ──
error_page 404 /404.html;
error_page 500 502 503 504 /500.html;