# ─────────────────────────────────────────────────────────────────────────────
# HestiaCP Custom nginx Config — SCORM Content Router
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE
# -------
# Rise 360 and Storyline 360 build asset URLs at runtime using
# window.location.pathname. Inside the SCORM iframe the pathname is
# /scorm-content/serve.php, so Rise 360 computes the asset base as
# /scorm-content/ and requests files like:
#
#   GET /scorm-content/mobile/5kajvJjEtQ6.png
#   GET /scorm-content/html5/lib/stylesheets/mobile.min.css
#   GET /scorm-content/analytics-frame.html
#   GET /scorm-content/html5/data/js/5Wqc1kusfrt.js
#
# These go directly to nginx — bypassing serve.php — and return 404.
#
# WHY ^~ IS REQUIRED
# ------------------
# The HestiaCP default template has:
#
#   location / {
#       location ~* ^.+\.(jpeg|jpg|png|webp|gif|bmp|ico|svg|css|js)$ {
#           expires max;
#       }
#       ...
#   }
#
# A plain `location ~ ^/scorm-content/...` regex block added at the server
# level is evaluated AFTER the nested static-file location inside `location /`
# wins for .jpg/.png/.js/.css files, so the rewrite never fires.
#
# Using `location ^~ /scorm-content/` (prefix + no-regex flag) tells nginx:
# "if the URI starts with /scorm-content/, stop location matching here and
# use this block — do NOT try any regex locations."  This takes priority over
# the `location /` block and its nested static-file regex.
#
# INSTALLATION (HestiaCP)
# -----------------------
# ⚠️  THIS FILE IS HARD-CODED FOR THE h-pcas.pursuitpathways.com SERVER.
#     There are TWO lines below marked "!! CHANGE THIS !!" that MUST be
#     edited when deploying to a different domain (e.g. edu.pursuitpathways.com):
#       1. the fastcgi_pass socket, and
#       2. the include path for the HestiaCP fastcgi cache config.
#
# For h-pcas.pursuitpathways.com (current):
#   Copy this file to:
#     /home/Nathan/conf/web/h-pcas.pursuitpathways.com/nginx.ssl.conf_scorm
#   Also create (or symlink) for non-SSL:
#     /home/Nathan/conf/web/h-pcas.pursuitpathways.com/nginx.conf_scorm
#   Then reload nginx:
#     sudo nginx -t && sudo systemctl reload nginx
#
# For edu.pursuitpathways.com (alternate deployment):
#   Copy this file to:
#     /home/Nathan/conf/web/edu.pursuitpathways.com/nginx.ssl.conf_scorm
#   Also create (or symlink) for non-SSL:
#     /home/Nathan/conf/web/edu.pursuitpathways.com/nginx.conf_scorm
#   THEN EDIT THE TWO "!! CHANGE THIS !!" LINES to use:
#     fastcgi_pass unix:/run/php/php8.3-fpm-edu.pursuitpathways.com.sock;
#     include /home/Nathan/conf/web/edu.pursuitpathways.com/nginx.fastcgi_cache.conf*;
#   Then reload nginx:
#     sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Outer block: claim /scorm-content/ with ^~ so nginx stops regex matching
# and enters this block for ALL /scorm-content/* requests.
location ^~ /scorm-content/ {

    # Pass serve.php, debug.php, proxy.php straight through to PHP-FPM.
    location ~ ^/scorm-content/(serve|debug|proxy)\.php(/|$) {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param HTTP_EARLY_DATA $rfc_early_data if_not_empty;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # !! CHANGE THIS !! — HestiaCP PHP-FPM socket for THIS domain.
        fastcgi_pass unix:/run/php/php8.3-fpm-h-pcas.pursuitpathways.com.sock;
        # !! CHANGE THIS !! — HestiaCP fastcgi cache include for THIS domain.
        include /home/Nathan/conf/web/h-pcas.pursuitpathways.com/nginx.fastcgi_cache.conf*;
    }

    # Everything else under /scorm-content/ → rewrite through serve.php.
    # Extract pkg and t from the Referer header.
    # The Referer looks like:
    #   https://h-pcas.pursuitpathways.com/scorm-content/serve.php?pkg=26&t=TOKEN&path=
    set $scorm_pkg "";
    set $scorm_token "";

    if ($http_referer ~* [?&]pkg=([0-9]+)) {
        set $scorm_pkg $1;
    }
    if ($http_referer ~* [?&]t=([A-Za-z0-9._%-]+)) {
        set $scorm_token $1;
    }

    # If we could not extract a pkg from the Referer, return 404
    # (prevents unauthenticated direct access to S3 assets).
    if ($scorm_pkg = "") {
        return 404;
    }

    # Rewrite to serve.php, preserving pkg, token, and the requested path.
    rewrite ^/scorm-content/(.+)$ /scorm-content/serve.php?pkg=$scorm_pkg&t=$scorm_token&path=$1 last;
}
