<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="icon" type="image/svg+xml" href="/hpcas.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #D3E2F3;
            color: #232D63;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #BBBDB7;
            border-radius: 20px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        .code {
            font-size: 6rem;
            font-weight: 800;
            color: #82ACD6;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        .title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #232D63;
            margin: 12px 0 8px;
        }
        .sub {
            font-size: 0.95rem;
            color: #232D63;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #82ACD6;
            color: #fff;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #00808E; }
        .home { display: inline-block; margin-top: 16px; font-size: 0.85rem; color: #82ACD6; font-weight: 600; text-decoration: none; margin-left: 16px; }
        .home:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <div class="title">Page Not Found</div>
        <div class="sub">The page you are looking for doesn't exist, may have been moved, or the link is incorrect.</div>
        <a class="btn" href="/dashboard/">Go to Dashboard</a>
        <a class="home" href="/">Return Home</a>
    </div>
</body>
</html>
