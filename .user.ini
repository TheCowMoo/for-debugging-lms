; PURSUIT PATHWAYS LMS — Per-directory PHP settings
; ------------------------------------------------------------------
; Raises PHP upload limits to support SCORM package uploads.
; Works on PHP-FPM/CGI/LiteSpeed hosts. Values below are conservative
; to stay within common shared-hosting ceilings.
; NOTE: If the hosting panel hard-caps these (e.g. cPanel MultiPHP INI
; Editor), set them there instead.
; ------------------------------------------------------------------

upload_max_filesize = 512M
post_max_size       = 520M
max_execution_time  = 600
max_input_time      = 600
memory_limit        = 512M
