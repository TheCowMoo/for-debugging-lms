<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong</title>
    <link rel="icon" type="image/png" href="/hpcas.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F4F9F7;
            color: #1A2E2A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #BBBDB7;
            border-radius: 20px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        .code { font-size: 5rem; font-weight: 800; color: #006F53; line-height: 1; letter-spacing: -0.03em; }
        .title { font-size: 1.35rem; font-weight: 700; color: #1A2E2A; margin: 12px 0 8px; }
        .sub { font-size: 0.95rem; color: #1A2E2A; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #006F53;
            color: #fff;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #60B49A; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <div class="title">Something Went Wrong</div>
        <div class="sub">An unexpected error occurred. Please try again in a moment. If the problem persists, contact support.</div>
        <a class="btn" href="/dashboard/">Go to Dashboard</a>
    </div>
</body>
</html>
